<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 382" width="944" height="382" role="img" aria-label="Loss contours for second-order and regression compensation"><title>Loss contours for second-order and regression compensation</title><rect width="944" height="382" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="35" font-size="23" fill="#233448" font-weight="700" text-anchor="start">Why compensation works: correlated input features</text><line x1="90" y1="330" x2="615" y2="330" stroke="#687586" stroke-width="2" /><line x1="90" y1="330" x2="90" y2="66" stroke="#687586" stroke-width="2" /><text x="600" y="352" font-size="17" fill="#233448" font-weight="700" text-anchor="start">w₁</text><text x="66" y="78" font-size="17" fill="#233448" font-weight="700" text-anchor="start">w₂</text><ellipse cx="280" cy="210" rx="182" ry="27" fill="none" stroke="#c7dbe9" stroke-width="2" transform="rotate(43 280 210)"/><ellipse cx="280" cy="210" rx="150" ry="22" fill="none" stroke="#c7dbe9" stroke-width="2" transform="rotate(43 280 210)"/><ellipse cx="280" cy="210" rx="118" ry="17" fill="none" stroke="#c7dbe9" stroke-width="2" transform="rotate(43 280 210)"/><ellipse cx="280" cy="210" rx="86" ry="12" fill="none" stroke="#c7dbe9" stroke-width="2" transform="rotate(43 280 210)"/><ellipse cx="280" cy="210" rx="54" ry="7" fill="none" stroke="#1772d0" stroke-width="2" transform="rotate(43 280 210)"/><line x1="280" y1="210" x2="280" y2="330" stroke="#cf8858" stroke-width="2" stroke-dasharray="5 4"/><line x1="280" y1="330" x2="418" y2="330" stroke="#129783" stroke-width="4" /><circle cx="280" cy="210" r="7" fill="#1772d0" stroke="white" stroke-width="2"/><circle cx="280" cy="330" r="7" fill="#cf8858" stroke="white" stroke-width="2"/><circle cx="418" cy="330" r="7" fill="#129783" stroke="white" stroke-width="2"/><text x="274" y="192" font-size="13" fill="#1772d0" font-weight="700" text-anchor="middle">original (1, 1)</text><text x="268" y="353" font-size="13" fill="#cf8858" font-weight="600" text-anchor="middle">naive (1, 0)</text><text x="423" y="312" font-size="13" fill="#129783" font-weight="700" text-anchor="middle">refit (2.05, 0)</text><rect x="648" y="76" width="260" height="260" rx="12" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="667" y="109" font-size="17" fill="#233448" font-weight="700" text-anchor="start">Two samples</text><text x="667" y="144" font-size="15" fill="#263648" font-weight="400" text-anchor="start">X = [[1, 1], [1, 1.1]]</text><text x="667" y="177" font-size="15" fill="#263648" font-weight="400" text-anchor="start">w = [1, 1]</text><line x1="666" y1="194" x2="885" y2="194" stroke="#e9eef3" stroke-width="2" /><text x="667" y="225" font-size="14" fill="#687586" font-weight="400" text-anchor="start">Naive zeroing:</text><text x="885" y="225" font-size="16" fill="#cf8858" font-weight="700" text-anchor="end">1.105</text><text x="667" y="262" font-size="14" fill="#687586" font-weight="400" text-anchor="start">Optimal refit:</text><text x="885" y="262" font-size="16" fill="#129783" font-weight="700" text-anchor="end">0.0025</text><text x="667" y="301" font-size="12" fill="#687586" font-weight="400" text-anchor="start">Low-loss direction ≈ (1, −1)</text></g></svg>
