<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 963 368" width="963" height="368" role="img" aria-label="Dense GEMM, CSR SpMM and sparse MMA execution paths"><title>Dense GEMM, CSR SpMM and sparse MMA execution paths</title><rect width="963" height="368" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="26" y="35" font-size="23" fill="#233448" font-weight="700" text-anchor="start">How the same matrix reaches different GPU kernels</text><rect x="24" y="62" width="292" height="282" rx="11" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><rect x="39" y="79" width="262" height="42" rx="8" fill="#1772d0" stroke="none" stroke-width="1"/><text x="170" y="106" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">Dense GEMM</text><rect x="39" y="141" width="262" height="55" rx="7" fill="#ffffff" stroke="#e9eef3" stroke-width="1"/><text x="170" y="163" font-size="12" fill="#233448" font-weight="600" text-anchor="middle">Full dense tensor (zeros included)</text><text x="170" y="184" font-size="11" fill="#687586" font-weight="400" text-anchor="middle">weight storage / layout</text><text x="170" y="222" font-size="28" fill="#1772d0" font-weight="700" text-anchor="middle">↓</text><rect x="39" y="236" width="262" height="50" rx="7" fill="#e6f3fd" stroke="#1772d0" stroke-width="1"/><text x="170" y="266" font-size="13" fill="#233448" font-weight="700" text-anchor="middle">Dense Tensor Core / GEMM</text><text x="170" y="319" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">Regular tiles; zero multiplies remain</text><rect x="333" y="62" width="292" height="282" rx="11" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><rect x="348" y="79" width="262" height="42" rx="8" fill="#cf8858" stroke="none" stroke-width="1"/><text x="479" y="106" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">CSR SpMM</text><rect x="348" y="141" width="262" height="55" rx="7" fill="#ffffff" stroke="#e9eef3" stroke-width="1"/><t