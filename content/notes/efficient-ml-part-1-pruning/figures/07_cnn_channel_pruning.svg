<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 344" width="944" height="344" role="img" aria-label="CNN channel pruning with consistent downstream convolution inputs"><title>CNN channel pruning with consistent downstream convolution inputs</title><rect width="944" height="344" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="34" font-size="22" fill="#233448" font-weight="700" text-anchor="start">CNN channel pruning: dependent tensors must be sliced together</text><text x="30" y="87" font-size="17" fill="#233448" font-weight="700" text-anchor="start">Conv1 output filters (8)</text><rect x="30" y="109" width="58" height="58" rx="7" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="59" y="143" font-size="18" fill="#687586" font-weight="700" text-anchor="middle">0</text><line x1="37" y1="117" x2="81" y2="160" stroke="#c65f57" stroke-width="3" /><rect x="105" y="109" width="58" height="58" rx="7" fill="#e1f0fb" stroke="#1772d0" stroke-width="1"/><text x="134" y="143" font-size="18" fill="#1772d0" font-weight="700" text-anchor="middle">1</text><rect x="180" y="109" width="58" height="58" rx="7" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="209" y="143" font-size="18" fill="#687586" font-weight="700" text-anchor="middle">2</text><line x1="187" y1="117" x2="231" y2="160" stroke="#c65f57" stroke-width="3" /><rect x="255" y="109" width="58" height="58" rx="7" fill="#e1f0fb" stroke="#1772d0" stroke-width="1"/><text x="284" y="143" font-size="18" fill="#1772d0" font-weight="700" text-anchor="middle">3</text><rect x="330" y="109" width="58" height="58" rx="7" fill="#e1f0fb" stroke="#1772d0" stroke-width="1"/><text x="359" y="143" font-size="18" fill="#1772d0" font-weight="700" text-anchor="middle">4</text><rect x="405" y="109" width="58" height="58" rx="7" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="434" y="143" font-size="18" fill="#687586" font-weight="700" text-anchor="middle">5</text><line x1="412" y1="117" x2="456" y2="160" stroke="#c65f57" stroke-width="3" /><rect x="480" y="109" width="58" height="58" rx="7" fill="#e1f0fb" stroke="#1772d0" stroke-width="1"/><text x="509" y="143" font-size="18" fill="#1772d0" font-weight="700" text-anchor="middle">6</text><rect x="555" y="109" width="58" height="58" rx="7" fill="#e1f0fb" stroke="#1772d0" stroke-width="1"/><text x="584" y="143" font-size="18" fill="#1772d0" font-weight="700" text-anchor="middle">7</text><text x="660" y="135" font-size="20" fill="#129783" font-weight="700" text-anchor="start">→ keep 5 channels</text><line x1="28" y1="194" x2="905" y2="194" stroke="#e9eef3" stroke-width="2" /><text x="30" y="232" font-size="17" fill="#233448" font-weight="700" text-anchor="start">Conv2 input channel axis</text><rect x="294" y="212" width="610" height="70" rx="8" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><rect x="325" y="230" width="84" height="36" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="367" y="253" font-size="16" fill="#233448" font-weight="700" text-anchor="middle">c=1</text><rect x="432" y="230" width="84" height="36" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="474" y="253" font-size="16" fill="#233448" font-weight="700" text-anchor="middle">c=3</text><rect x="539" y="230" width="84" height="36" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="581" y="253" font-size="16" fill="#233448" font-weight="700" text-anchor="middle">c=4</text><rect x="646" y="230" width="84" height="36" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="688" y="253" font-size="16" fill="#233448" font-weight="700" text-anchor="middle">c=6</text><rect x="753" y="230" width="84" height="36" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="795" y="253" font-size="16" fill="#233448" font-weight="700" text-anchor="middle">c=7</text><text x="30" y="316" font-size="14" fill="#687586" font-weight="400" text-anchor="start">Conv1: [8, Cin, r, s] → [5, Cin, r, s]   |   Conv2: [Cout, 8, r, s] → [Cout, 5, r, s]</text></g></svg>
