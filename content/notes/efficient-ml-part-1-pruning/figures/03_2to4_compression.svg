<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 365" width="950" height="365" role="img" aria-label="2:4 weight packing and sparse tensor core execution"><title>2:4 weight packing and sparse tensor core execution</title><rect width="950" height="365" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="30" y="36" font-size="23" fill="#233448" font-weight="700" text-anchor="start">2:4 packing: two values plus position metadata</text><text x="30" y="78" font-size="15" fill="#263648" font-weight="600" text-anchor="start">Original group along the reduction dimension k</text><rect x="63" y="100" width="83" height="62" rx="9" fill="#d9ebf9" stroke="#1772d0" stroke-width="1"/><text x="104" y="134" font-size="19" fill="#263648" font-weight="700" text-anchor="middle">0.80</text><text x="104" y="151" font-size="11" fill="#687586" font-weight="400" text-anchor="middle">k=0</text><rect x="162" y="100" width="83" height="62" rx="9" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="203" y="134" font-size="19" fill="#263648" font-weight="700" text-anchor="middle">0.05</text><text x="203" y="151" font-size="11" fill="#687586" font-weight="400" text-anchor="middle">k=1</text><rect x="261" y="100" width="83" height="62" rx="9" fill="#d9ebf9" stroke="#1772d0" stroke-width="1"/><text x="302" y="134" font-size="19" fill="#263648" font-weight="700" text-anchor="middle">−0.60</text><text x="302" y="151" font-size="11" fill="#687586" font-weight="400" text-anchor="middle">k=2</text><rect x="360" y="100" width="83" height="62" rx="9" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="401" y="134" font-size="19" fill="#263648" font-weight="700" text-anchor="middle">0.02</text><text x="401" y="151" font-size="11" fill="#687586" font-weight="400" text-anchor="middle">k=3</text><text x="234" y="208" font-size="16" fill="#1772d0" font-weight="600" text-anchor="middle">↓ Keep two largest magnitudes</text><rect x="30" y="236" width="426" height="104" rx="8" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="50" y="261" font-size="14" fill="#233448" font-weight="700" text-anchor="start">Packed values</text><rect x="60" y="277" width="102" height="40" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="111" y="302" font-size="18" fill="#263648" font-weight="700" text-anchor="middle">0.80</text><rect x="170" y="277" width="102" height="40" rx="6" fill="#dff2ed" stroke="#129783" stroke-width="1"/><text x="221" y="302" font-size="18" fill="#263648" font-weight="700" text-anchor="middle">−0.60</text><text x="302" y="261" font-size="14" fill="#233448" font-weight="700" text-anchor="start">Indices</text><rect x="313" y="277" width="57" height="40" rx="6" fill="#ffffff" stroke="#e9eef3" stroke-width="1"/><text x="342" y="302" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">0</text><rect x="378" y="277" width="57" height="40" rx="6" fill="#ffffff" stroke="#e9eef3" stroke-width="1"/><text x="406" y="302" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">2</text><text x="520" y="104" font-size="18" fill="#233448" font-weight="700" text-anchor="start">Sparse Tensor Core (conceptual)</text><rect x="520" y="122" width="400" height="215" rx="10" fill="#f7f9fc" stroke="#e9eef3" stroke-width="1"/><text x="544" y="157" font-size="17" fill="#1772d0" font-weight="600" text-anchor="start">Select activations x₀ and x₂</text><text x="544" y="195" font-size="19" fill="#233448" font-weight="700" text-anchor="start">y = 0.80 · x₀ − 0.60 · x₂</text><line x1="542" y1="221" x2="901" y2="221" stroke="#e9eef3" stroke-width="2" /><text x="544" y="251" font-size="15" fill="#263648" font-weight="400" text-anchor="start">No runtime branch per zero.</text><text x="544" y="276" font-size="15" fill="#263648" font-weight="400" text-anchor="start">Packed representation is decoded</text><text x="544" y="301" font-size="15" fill="#263648" font-weight="400" text-anchor="start">by specialized matrix instructions.</text></g></svg>
