<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 967 170" width="967" height="170" role="img" aria-label="Pruning recovery and deployment pipeline"><title>Pruning recovery and deployment pipeline</title><rect width="967" height="170" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="32" font-size="22" fill="#233448" font-weight="700" text-anchor="start">From sparse support to real GPU speedup</text><rect x="16" y="62" width="142" height="88" rx="9" fill="#f7f9fc" stroke="#1772d0" stroke-width="1"/><text x="87" y="94" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">Calibrate</text><text x="87" y="120" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">collect X</text><text x="167" y="109" font-size="20" fill="#1772d0" font-weight="700" text-anchor="middle">→</text><rect x="175" y="62" width="142" height="88" rx="9" fill="#f7f9fc" stroke="#1772d0" stroke-width="1"/><text x="246" y="94" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">Score</text><text x="246" y="120" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">|w|, Wanda, Hessian</text><text x="326" y="109" font-size="20" fill="#1772d0" font-weight="700" text-anchor="middle">→</text><rect x="334" y="62" width="142" height="88" rx="9" fill="#f7f9fc" stroke="#1772d0" stroke-width="1"/><text x="405" y="94" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">Prune</text><text x="405" y="120" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">choose support</text><text x="485" y="109" font-size="20" fill="#1772d0" font-weight="700" text-anchor="middle">→</text><rect x="493" y="62" width="142" height="88" rx="9" fill="#f7f9fc" stroke="#1772d0" stroke-width="1"/><text x="564" y="94" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">Recover</text><text x="564" y="120" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">regression / FT</text><text x="644" y="109" font-size="20" fill="#1772d0" font-weight="700" text-anchor="middle">→</text><rect x="652" y="62" width="142" height="88" rx="9" fill="#f7f9fc" stroke="#1772d0" stroke-width="1"/><text x="723" y="94" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">Deploy</text><text x="723" y="120" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">pack or shrink</text><text x="803" y="109" font-size="20" fill="#1772d0" font-weight="700" text-anchor="middle">→</text><rect x="811" y="62" width="142" height="88" rx="9" fill="#e1f2e9" stroke="#129783" stroke-width="1"/><text x="882" y="94" font-size="17" fill="#233448" font-weight="700" text-anchor="middle">Benchmark</text><text x="882" y="120" font-size="12" fill="#687586" font-weight="400" text-anchor="middle">latency &amp; accuracy</text></g></svg>
